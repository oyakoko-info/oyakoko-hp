<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材書庫 | オヤココ</title><meta name="description" content="オヤココの小学生向け教材書庫。学年・教科・単元からドリルを探せます。"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#263b35;background:#f6f8f4}*{box-sizing:border-box}body{margin:0}a{color:#17617a}button,input{font:inherit}button{cursor:pointer}main{max-width:940px;margin:auto;padding:18px 16px 70px}.hero,.panel,.unit{background:white;border:1px solid #e1e8df;border-radius:18px;padding:24px;margin-bottom:17px;box-shadow:0 2px 12px #243e2b08}.hero{background:linear-gradient(125deg,#fff,#f2f9ef)}h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:0 0 12px}p{line-height:1.7}.muted{color:#617269}.note{background:#eef5ed;padding:12px 14px;border-radius:12px;font-size:14px}.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.subjects{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.choice{border:1px solid #ccd8cd;border-radius:11px;background:white;padding:12px 5px;min-height:48px;color:#32493d;font-weight:650}.choice.active{background:#276b54;color:white;border-color:#276b54}.choice:focus-visible,a:focus-visible{outline:3px solid #e9ad37;outline-offset:2px}.choice:disabled{opacity:.55;cursor:not-allowed}.count{font-weight:700}.search{display:block;width:100%;padding:14px;border:1px solid #b8c9bc;border-radius:11px;font-size:16px;margin:14px 0}.unit{padding:20px}.drill{border-top:1px solid #eef0ed;padding:12px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}.drill a{line-height:1.5;text-decoration:none}.drill a:hover{text-decoration:underline}.answer{white-space:nowrap;font-size:14px}.challenge{margin-top:12px;padding:14px;background:#fff5d9;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.challenge a{font-weight:750}.empty{background:#fff;padding:25px;border-radius:14px;text-align:center;color:#617269}.foot{font-size:13px;color:#617269;margin-top:25px}.crumb{font-size:14px;color:#617269}.hidden{display:none!important}@media(max-width:650px){.chips{grid-template-columns:repeat(3,minmax(0,1fr))}.subjects{grid-template-columns:repeat(3,minmax(0,1fr))}.panel,.hero,.unit{padding:17px}.drill{align-items:flex-start;flex-direction:column;gap:6px}.challenge{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header class="hero"><h1>🐼 オヤココ 教材書庫</h1><p>「勉強しなさい」から「今日はこれをやってみよう！」へ。</p><p class="note">学校や教科書によって、単元を習う順番や進み方は異なります。学校で習っている単元や、復習したい単元から選んでください。現在の教材は公開前の試作版です。</p></header><section class="panel"><h2>① 学年を選ぶ</h2><div class="chips" id="grades" aria-label="学年"></div><h2 style="margin-top:24px">② 教科を選ぶ</h2><div class="subjects" id="subjects" aria-label="教科"></div></section><section class="panel"><p class="crumb" id="crumb"></p><h2 id="heading">教材を選ぼう</h2><div id="ready" class="hidden"><p id="stats" class="count"></p><label for="q"><strong>③ 単元名・教材番号で探す</strong></label><input id="q" class="search" type="search" placeholder="例：大きい数、S4-010" autocomplete="off"><p id="found" class="muted" aria-live="polite"></p><div id="units"></div></div><div id="empty" class="empty hidden">この学年・教科の教材は、これから追加する予定です。🐼</div></section><footer class="foot">© オヤココ｜教材PDFはクリック1回で開きます。「パンダらの箱」の解答・ヒントは講師専用です。</footer></main><script src="./catalog.js"></script><script>
/* 教材追加時は catalog.json と PDF だけを更新。画面デザインは共通。 */
const GRADES=['1','2','3','4','5','6'], SUBJECTS=['算数','国語','理科','社会','英語'];let grade='4',subject='算数',catalog=window.OYAKOKO_CATALOG||{};const el=id=>document.getElementById(id);
function choice(container,values,selected,fn,unit){el(container).replaceChildren(...values.map(v=>{const b=document.createElement('button');b.type='button';b.className='choice'+(v===selected?' active':'');b.textContent=v+unit;b.setAttribute('aria-pressed',String(v===selected));b.onclick=()=>fn(v);return b}))}
function link(file,label,cls){const a=document.createElement('a');a.href=encodeURI(file);a.target='_blank';a.rel='noopener';a.textContent=label;if(cls)a.className=cls;return a}
function render(){choice('grades',GRADES,grade,v=>{grade=v;el('q').value='';render()},'年');choice('subjects',SUBJECTS,subject,v=>{subject=v;el('q').value='';render()},'');el('crumb').textContent=`小学${grade}年生 / ${subject}`;const data=catalog.grades?.[grade]?.[subject];el('ready').classList.toggle('hidden',!data);el('empty').classList.toggle('hidden',!!data);el('heading').textContent=data?`小学${grade}年生・${subject}`:'教材準備中';if(!data)return;const all=data.units;el('stats').textContent=`通常ドリル ${all.reduce((n,u)=>n+u.drills.length,0)}冊 ＋ パンダらの箱 ${all.filter(u=>u.challenge).length}問`;const q=el('q').value.trim().toLowerCase();let found=0;el('units').replaceChildren();for(const u of all){const matching=u.drills.filter(d=>!q||(u.title+' '+d.title).toLowerCase().includes(q));const showChallenge=u.challenge&&(!q||(u.title+' '+u.challenge+' パンダらの箱').toLowerCase().includes(q));if(!matching.length&&!showChallenge)continue;found++;const section=document.createElement('section');section.className='unit';const h=document.createElement('h3');h.textContent=u.title;section.append(h);for(const d of matching){const row=document.createElement('div');row.className='drill';row.append(link(d.pdf,'📄 '+d.title+' ↗'));row.append(d.answer?link(d.answer,'答えを見る ↗','answer'):Object.assign(document.createElement('span'),{textContent:'答え：準備中',className:'muted'}));section.append(row)}if(showChallenge){const c=document.createElement('div');c.className='challenge';const tag=document.createElement('span');tag.textContent='🐼 パンダらの箱';c.append(tag,link(u.challenge,'開けてはならない・・・ 📦'));section.append(c)}el('units').append(section)}el('found').textContent=`${found}単元を表示中`}
el('q').addEventListener('input',render);render();
</script></body></html>
